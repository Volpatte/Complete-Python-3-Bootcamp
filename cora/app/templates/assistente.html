{% extends "app_shell.html" %}
{% set tab = 'msg' %}
{% block title %}Assistente Cora{% endblock %}
{% block screen %}

<div class="chat-head">
  <a href="/familia/mensagens" class="back">‹</a>
  <div class="pin" style="width:42px;height:42px;border-radius:13px;background:#25d366;display:grid;place-items:center;font-size:20px">🤖</div>
  <div style="flex:1">
    <div style="font-weight:800">Assistente Cora</div>
    <div style="font-size:12px;opacity:.85">IA · responde 24 horas 💜</div>
  </div>
</div>

<div id="chat" class="bubbles" style="padding-bottom:8px">
  <div class="bubble them">{{ saudacao.texto }}<div class="t">agora</div></div>
  <div class="smart-replies sugrow" style="padding:6px 0">
    {% for s in saudacao.sugestoes %}<div class="sr" onclick="send(this.textContent)">{{ s }}</div>{% endfor %}
  </div>
</div>

<div class="composer">
  <input id="msg" autocomplete="off" placeholder="Pergunte à Cora…"
         onkeydown="if(event.key==='Enter'){send(this.value); this.value=''}">
  <button class="cta" style="width:52px;padding:13px" onclick="var m=document.getElementById('msg'); send(m.value); m.value=''">➤</button>
</div>

<style>
  .composer { position: sticky; bottom: 84px; display:flex; gap:10px; align-items:center;
              padding: 10px 16px; background: linear-gradient(180deg, transparent, var(--surface-2) 30%); }
  .composer input { flex:1; border:1px solid var(--line); border-radius:16px; padding:13px 16px; font-size:14px; font-family:inherit; background:#fff; }
  .typing span { display:inline-block; width:7px; height:7px; margin:0 1px; border-radius:50%; background:var(--muted); animation: blink 1.2s infinite both; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
</style>

<script>
  const chat = document.getElementById('chat');
  const screen = document.querySelector('.screen');
  function scrollDown(){ requestAnimationFrame(()=> screen.scrollTo({top: screen.scrollHeight, behavior:'smooth'})); }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }

  function bubble(text, who){
    const d = document.createElement('div');
    d.className = 'bubble ' + who;
    d.innerHTML = fmt(text) + '<div class="t">agora</div>';
    chat.appendChild(d); scrollDown(); return d;
  }
  function clearSugs(){ chat.querySelectorAll('.sugrow').forEach(e=>e.remove()); }
  function sugs(list){
    if(!list || !list.length) return;
    const row = document.createElement('div');
    row.className = 'smart-replies sugrow'; row.style.padding='6px 0';
    list.forEach(s=>{ const c=document.createElement('div'); c.className='sr'; c.textContent=s; c.onclick=()=>send(s); row.appendChild(c); });
    chat.appendChild(row); scrollDown();
  }

  async function send(text){
    text = (text||'').trim(); if(!text) return;
    clearSugs();
    bubble(text, 'me');
    const typing = document.createElement('div');
    typing.className = 'bubble them typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(typing); scrollDown();
    try {
      const r = await fetch('/api/assistente', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mensagem: text})
      });
      const data = await r.json();
      typing.remove();
      bubble(data.texto, 'them');
      sugs(data.sugestoes);
    } catch(e){
      typing.remove();
      bubble('Ops, tive um probleminha de conexão. Pode tentar de novo? 💜', 'them');
    }
  }
</script>

{% endblock %}
