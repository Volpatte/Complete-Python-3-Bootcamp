<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12060f">
  <title>Entrar · Cora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#160b13; --muted:#6f6570; --line:#efe7ec; --soft:#faf6f8;
      --rose:#d6336c; --grad:linear-gradient(120deg,#ff5a7a 0%,#e21e79 46%,#7c3aed 100%);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background:var(--plum,#12060f); position:relative; overflow:hidden;
      font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:var(--ink);
    }
    body::before,body::after{content:""; position:absolute; border-radius:50%; filter:blur(70px); opacity:.7; z-index:0}
    body::before{width:460px; height:460px; background:radial-gradient(circle,#ff4d6d,transparent 62%); top:-160px; left:-120px}
    body::after{width:500px; height:500px; background:radial-gradient(circle,#7c3aed,transparent 62%); bottom:-200px; right:-120px}
    a{color:inherit; text-decoration:none}
    .wrap{position:relative; z-index:1; width:100%; max-width:410px}
    .brand{display:flex; align-items:center; gap:11px; justify-content:center; color:#fff; font-weight:800;
      font-size:22px; letter-spacing:-.02em; margin-bottom:20px}
    .heart{width:38px; height:38px; border-radius:12px; background:var(--grad); display:grid; place-items:center;
      color:#fff; font-size:17px; box-shadow:0 8px 22px rgba(226,30,121,.4)}
    .card{background:#fff; border-radius:26px; padding:32px 28px; box-shadow:0 40px 80px rgba(0,0,0,.4)}
    .card h1{font-size:22px; margin:0 0 4px; letter-spacing:-.02em}
    .card .sub{color:var(--muted); font-size:14px; margin:0 0 22px}
    label{display:block; font-size:13px; font-weight:700; margin:14px 0 6px}
    input{width:100%; padding:13px 15px; border:1px solid var(--line); border-radius:13px;
      font-family:inherit; font-size:15px; background:var(--soft); transition:.15s}
    input:focus{outline:0; border-color:var(--rose); background:#fff; box-shadow:0 0 0 4px rgba(214,51,108,.1)}
    .erro{background:#ffe9ee; color:#e11d48; padding:11px 14px; border-radius:12px; font-size:13.5px; margin-bottom:16px}
    .cta{width:100%; margin-top:22px; padding:14px; border:0; border-radius:13px; cursor:pointer;
      font-family:inherit; font-weight:700; font-size:15px; color:#fff; background:var(--grad);
      box-shadow:0 12px 26px rgba(226,30,121,.32); transition:.2s}
    .cta:hover{transform:translateY(-1px); box-shadow:0 16px 32px rgba(226,30,121,.4)}
    .demo{margin-top:22px; padding-top:20px; border-top:1px solid var(--line)}
    .demo p{font-size:12.5px; color:var(--muted); margin:0 0 12px; text-align:center}
    .demo p b{color:var(--rose)}
    .row{display:flex; gap:8px}
    .row a{flex:1; text-align:center; font-size:12.5px; font-weight:700; padding:12px 6px; border-radius:12px;
      background:var(--soft); border:1px solid var(--line); color:var(--ink); transition:.15s}
    .row a:hover{border-color:var(--rose); color:var(--rose); transform:translateY(-2px)}
    .back{display:block; text-align:center; margin-top:20px; color:rgba(255,255,255,.7); font-size:13px; font-weight:600}
    .back:hover{color:#fff}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="heart">♥</span> Cora</div>
    <div class="card">
      <h1>Bem-vindo de volta 💜</h1>
      <p class="sub">Entre para acompanhar a escola de quem você ama.</p>

      {% if erro %}<div class="erro">E-mail ou senha incorretos. Tente novamente.</div>{% endif %}

      <form action="/login" method="post">
        <label>E-mail</label>
        <input name="email" type="email" placeholder="voce@email.com" required>
        <label>Senha</label>
        <input name="senha" type="password" placeholder="••••••••" required>
        <button class="cta">Entrar</button>
      </form>

      <div class="demo">
        <p>Acesso rápido para demonstração (senha: <b>cora123</b>)</p>
        <div class="row">
          <a href="/login/demo/familia">👨‍👩‍👧 Família</a>
          <a href="/login/demo/professor">👩‍🏫 Professor</a>
          <a href="/login/demo/coordenacao">🏫 Coordenação</a>
        </div>
      </div>
    </div>
    <a href="/" class="back">← Voltar ao início</a>
  </div>
</body>
</html>
